name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-manga-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # The signing key is kept outside the code. If the repo has the secret
      # SIGNING_KEYSTORE_B64 (+ SIGNING_STORE_PASSWORD) it is used. Otherwise a key is
      # created once and kept in the private Actions cache, so app updates install
      # over the old version without uninstalling.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.rangmanga-signing
          key: rangmanga-signing-key-v1

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          DIR="$HOME/.rangmanga-signing"
          mkdir -p "$DIR"
          if [ -n "${KEYSTORE_B64}" ] && [ -n "${KEYSTORE_PASS}" ]; then
            echo "Using signing key from repository secrets"
            echo "${KEYSTORE_B64}" | base64 -d > "$RUNNER_TEMP/release-secret.jks"
            KS="$RUNNER_TEMP/release-secret.jks"
            PASS="${KEYSTORE_PASS}"
          else
            if [ ! -f "$DIR/release.jks" ]; then
              echo "Creating a new signing key (first build)"
              NEWPASS="$(openssl rand -hex 16)"
              keytool -genkeypair -keystore "$DIR/release.jks" -alias rangmanga -keyalg RSA -keysize 2048 \
                -validity 10000 -storepass "$NEWPASS" -keypass "$NEWPASS" \
                -dname "CN=Rang Manga, O=Rang Manga, C=IN" >/dev/null
              printf '%s' "$NEWPASS" > "$DIR/pass.txt"
            else
              echo "Using saved signing key"
            fi
            KS="$DIR/release.jks"
            PASS="$(cat "$DIR/pass.txt")"
          fi
          echo "::add-mask::$PASS"
          {
            echo "SIGNING_KEYSTORE=$KS"
            echo "SIGNING_STORE_PASSWORD=$PASS"
            echo "SIGNING_KEY_PASSWORD=$PASS"
            echo "SIGNING_KEY_ALIAS=rangmanga"
          } >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: gradle --no-daemon --stacktrace assembleRelease

      - name: Name the APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/RangManga-v1.0.${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: RangManga-v1.0.${{ github.run_number }}
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" out/*.apk \
            --repo "${{ github.repository }}" \
            --title "Rang Manga v1.0.${{ github.run_number }}" \
            --notes "Android app. Download the .apk file below on your phone and open it to install." \
            --latest
